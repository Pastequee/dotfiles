min_version = "2026.10.8"

[settings]
# This file is linked as the global config; project configs cannot enable updates.
tool_update.global_auto = "1d"
self_update.auto = "1d"

[tools]
node = "lts"
pnpm = "latest"
bun = "latest"
fzf = "latest"
helix = "latest"
gh = "latest"
ripgrep = "latest"
jq = "latest"
delta = "latest"
starship = "latest"
fd = "latest"
eza = "latest"
zoxide = "latest"
bat = "latest"
1password-cli = "latest"
mas = "latest"
cursor-agent = "latest"
codex = "latest"

[bootstrap.services.mise-tool-update]
builtin = "tool-update"

# Tool auto_update does not cover bootstrap packages. Upgrade apps daily too.
[bootstrap.macos.launchd.agents.mise-package-update]
program = "~/.local/bin/mise"
args = ["bootstrap", "packages", "upgrade", "--yes"]
working_directory = "~"
start_interval = 86400
process_type = "Background"
nice = 10
stdout_path = "~/Library/Logs/mise-package-update.log"
stderr_path = "~/Library/Logs/mise-package-update.err.log"

[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:helium-browser" = "latest"
"brew-cask:codexbar" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:yaak" = "latest"
"brew-cask:beekeeper-studio" = "latest"
"brew-cask:orbstack" = "latest"
"brew-cask:nordvpn" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:keepingyouawake" = "latest"
"brew-cask:shottr" = "latest"
"mas:1044549675" = "latest" # Elmedia Video Player
"mas:1451685025" = "latest" # Wireguard

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0
autohide_time_modifier = 0.4
tilesize = 60
show_recents = false

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { WebKitDeveloperExtras = true }
"com.apple.Accessibility" = { KeyRepeatEnabled = 0 }
"com.apple.NetworkBrowser" = { BrowseAllInterfaces = 1 }
"com.apple.finder" = { NewWindowTarget = "PfHm", ShowRecentTags = false }

# Spotlight: Option+Space (keycode 49, option 524288). Frees Command+Space for Tinycast.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 524288] } }

[bootstrap.hooks.post-defaults]
run = [
  "chflags nohidden ~/Library",
  "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u",
  "killall Finder Dock SystemUIServer 2>/dev/null || true",
]

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.zshrc" = { source = "home/zshrc", mode = "symlink" }
"~/.config/zsh" = { source = "home/zsh", mode = "symlink-each" }
"~/.config/git/config" = { source = "home/git/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "home/git/ignore", mode = "symlink" }
"~/.config/starship.toml" = { source = "home/starship.toml", mode = "symlink" }
"~/.config/helix/config.toml" = { source = "home/helix/config.toml", mode = "symlink" }
"~/.config/ghostty/config.ghostty" = { source = "home/ghostty/config.ghostty", mode = "symlink" }
"~/.ssh/config.d/dotfiles" = { source = "home/ssh/config", mode = "symlink" }
"~/.ssh/config/include-dotfiles" = { line = "Include ~/.ssh/config.d/dotfiles" }

# Deja uses its official installer; zinit is a git checkout, Tinycast a DMG.
# This file is also ~/.config/mise/config.toml, so task `file =` paths resolve from $HOME.
[tasks.bootstrap]
description = "Install zinit, Deja, zsh plugins, and Tinycast"
dir = "~/src/dotfiles"
run = "./scripts/install-extras.sh"
